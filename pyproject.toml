[project]
name = "assistant-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ashmander", email = "allwin123456@hotmail.es" }
]
requires-python = ">=3.11"
dependencies = [
    # Entrega 1: LLM local
    "ollama>=0.3.0",
    # Entrega 2: generacion y carga de fuentes de conocimiento
    "pandas>=2.2",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "pymupdf>=1.24",
    # Entrega 2: experimentacion
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "python-dotenv>=1.0",
    # Entrega 2: chunking
    "langchain-text-splitters>=0.3",
    # Entrega 2: modelos de embeddings
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "openai>=1.40",
    # Entrega 2: bases de datos vectoriales
    "chromadb>=0.5",
    "faiss-cpu>=1.8",
    "qdrant-client>=1.12",
    "weaviate-client>=4.9",
    "pinecone>=5.0",
    # Entrega 2: asistente RAG con LangChain
    "langchain-core>=1.6.10",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-classic>=1.0.8",
]

[project.scripts]
assistant-engine = "assistant_engine:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
