# Weaviate local para el Experimento 3 del notebook.
# Levantar:  docker compose up -d
# Detener:   docker compose down        (agregar -v para borrar los datos)
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.0
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8080:8080"    # REST
      - "50051:50051"  # gRPC (lo usa el cliente Python v4)
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none   # los vectores los calcula el notebook
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped

volumes:
  weaviate_data:
